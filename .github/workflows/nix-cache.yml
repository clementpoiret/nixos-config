name: Build and cache NixOS configurations

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 3 * * 0"
      timezone: Europe/Paris
  workflow_dispatch:

permissions: {}

concurrency:
  group: nix-cache-main
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Nix
        if: github.event_name == 'schedule'
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0

      - name: Update pinned stable releases
        if: github.event_name == 'schedule'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          update_release_input() {
            local repository="$1"
            local tag
            local url_pattern

            tag="$(
              gh api \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                "repos/${repository}/releases/latest" \
                --jq '.tag_name'
            )"

            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Refusing non-stable release tag for ${repository}: ${tag}" >&2
              exit 1
            fi

            url_pattern="^      url = \"github:${repository}/v[0-9]+\\.[0-9]+\\.[0-9]+\";$"
            if [[ "$(grep -Ec "$url_pattern" flake.nix)" -ne 1 ]]; then
              echo "Expected exactly one pinned ${repository} input" >&2
              exit 1
            fi

            sed -i -E \
              "s#(url = \"github:${repository}/)v[0-9]+\\.[0-9]+\\.[0-9]+(\";)#\\1${tag}\\2#" \
              flake.nix

            if ! grep -Fqx "      url = \"github:${repository}/${tag}\";" flake.nix; then
              echo "Failed to pin ${repository} to ${tag}" >&2
              exit 1
            fi
          }

          update_release_input herdrdev/herdr
          update_release_input yorukot/superfile

      - name: Update Logseq AppImage
        if: github.event_name == 'schedule'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          package_file="pkgs/logseq-appimage/default.nix"
          release_json="$(gh api --header "X-GitHub-Api-Version: 2022-11-28" repos/logseq/logseq/releases/latest)"
          version="$(
            jq -er \
              'select(.draft == false and .prerelease == false) | .tag_name | select(type == "string")' \
              <<<"$release_json"
          )"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Refusing non-stable Logseq release tag: ${version}" >&2
            exit 1
          fi

          version_pattern='^  version = "[0-9]+\.[0-9]+\.[0-9]+";$'
          hash_pattern='^    hash = "sha256-[A-Za-z0-9+/]{43}=";$'
          expected_url="    url = \"https://github.com/logseq/logseq/releases/download/\${version}/Logseq-linux-x86_64-\${version}.AppImage\";"

          if [[ "$(grep -Ec "$version_pattern" "$package_file")" -ne 1 ]]; then
            echo "Expected exactly one Logseq version declaration" >&2
            exit 1
          fi

          if [[ "$(grep -Ec "$hash_pattern" "$package_file")" -ne 1 ]]; then
            echo "Expected exactly one Logseq source hash" >&2
            exit 1
          fi

          if [[ "$(grep -Fxc "$expected_url" "$package_file")" -ne 1 ]]; then
            echo "Unexpected Logseq AppImage URL template" >&2
            exit 1
          fi

          asset_name="Logseq-linux-x86_64-${version}.AppImage"
          mapfile -t asset_urls < <(
            jq -r --arg asset_name "$asset_name" \
              '.assets[] | select(.name == $asset_name) | .browser_download_url' \
              <<<"$release_json"
          )

          if [[ "${#asset_urls[@]}" -ne 1 ]]; then
            echo "Expected exactly one ${asset_name} release asset" >&2
            exit 1
          fi

          asset_url="${asset_urls[0]}"
          expected_asset_url="https://github.com/logseq/logseq/releases/download/${version}/${asset_name}"
          if [[ "$asset_url" != "$expected_asset_url" ]]; then
            echo "Unexpected Logseq asset URL: ${asset_url}" >&2
            exit 1
          fi

          current_version="$(sed -nE 's/^  version = "([^"]+)";$/\1/p' "$package_file")"
          if [[ "$current_version" == "$version" ]]; then
            echo "Logseq ${version} is already current"
            exit 0
          fi

          hash="$(
            nix store prefetch-file --json "$asset_url" \
              | jq -er '.hash | select(test("^sha256-[A-Za-z0-9+/]{43}=$"))'
          )"

          sed -i -E \
            "s#^  version = \"[0-9]+\.[0-9]+\.[0-9]+\";\$#  version = \"${version}\";#" \
            "$package_file"
          sed -i -E \
            "s#^    hash = \"sha256-[A-Za-z0-9+/]{43}=\";\$#    hash = \"${hash}\";#" \
            "$package_file"

          grep -Fqx "  version = \"${version}\";" "$package_file"
          grep -Fqx "    hash = \"${hash}\";" "$package_file"

      - name: Update flake inputs
        if: github.event_name == 'schedule'
        run: nix flake update

      - name: Verify update scope
        if: github.event_name == 'schedule'
        run: |
          if ! git diff --quiet -- . ':(exclude)flake.nix' ':(exclude)flake.lock' ':(exclude)pkgs/logseq-appimage/default.nix'; then
            echo "Refusing to continue with changes outside the dependency update scope" >&2
            git diff --stat >&2
            exit 1
          fi

      - name: Upload effective dependency files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-update
          path: |
            flake.nix
            flake.lock
            pkgs/logseq-appimage/default.nix
          if-no-files-found: error
          retention-days: 1

  shared-checks:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Download effective dependency files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dependency-update
          path: .

      - name: Reclaim runner disk space
        run: |
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache
          df -h /

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0

      - name: Configure Cachix
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: clementpoiret
          extraPullNames: nix-community,niri
          skipPush: true

      - name: Realize flake evaluation dependencies
        run: |
          # Stylix and fw-fanctrl read generated files while evaluating the flake.
          nix build \
            --no-link \
            --no-update-lock-file \
            .#nixosConfigurations.desktop.pkgs.base16-schemes \
            .#nixosConfigurations.laptop.pkgs.fw-fanctrl

      - name: Evaluate all flake checks
        run: nix flake check --no-build --no-update-lock-file

      - name: Build shared flake checks
        run: |
          nix build \
            --no-link \
            --no-update-lock-file \
            --print-build-logs \
            --keep-going \
            .#checks.x86_64-linux.host-cpu-optimizations \
            .#checks.x86_64-linux.apparmor-mode-matrix \
            .#checks.x86_64-linux.apparmor-policy-parser \
            .#checks.x86_64-linux.apparmor-vm

  build-host:
    name: Build and cache ${{ matrix.host }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        host:
          - desktop
          - laptop
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Download effective dependency files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dependency-update
          path: .

      - name: Reclaim runner disk space
        run: |
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache
          df -h /

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0

      - name: Require Cachix credentials
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: test -n "$CACHIX_AUTH_TOKEN"

      - name: Configure Cachix
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: clementpoiret
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community,niri
          skipPush: true

      - name: Build and cache selected host outputs
        shell: bash
        run: |
          set -euo pipefail

          cachix watch-exec clementpoiret -- \
            nix build \
              --no-link \
              --no-update-lock-file \
              --print-build-logs \
              ".#cache-root-${{ matrix.host }}" \
              ".#nixosConfigurations.${{ matrix.host }}.pkgs.flake.herdr"

          root="$(
            nix build \
              --no-link \
              --print-out-paths \
              --no-update-lock-file \
              ".#cache-root-${{ matrix.host }}"
          )"

          cachix pin clementpoiret "host-optimized-${{ matrix.host }}" "$root" --keep-revisions 1

      - name: Build host configuration
        run: |
          nix build \
            --no-link \
            --no-update-lock-file \
            --print-build-logs \
            ".#checks.x86_64-linux.${{ matrix.host }}-toplevel"

  commit-update:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs:
      - shared-checks
      - build-host
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Download verified dependency files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dependency-update
          path: .

      - name: Commit updated dependencies
        run: |
          if git diff --quiet -- flake.nix flake.lock pkgs/logseq-appimage/default.nix; then
            echo "Dependencies are already current"
            exit 0
          fi

          if ! git diff --quiet -- . ':(exclude)flake.nix' ':(exclude)flake.lock' ':(exclude)pkgs/logseq-appimage/default.nix'; then
            echo "Refusing to commit changes outside the dependency update scope" >&2
            git diff --stat >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.nix flake.lock pkgs/logseq-appimage/default.nix
          git commit -m "chore(deps): update dependencies"
          git push origin HEAD:main
