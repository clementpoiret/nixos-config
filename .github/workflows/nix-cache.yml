name: Build and cache NixOS configurations

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 3 * * 0"
      timezone: Europe/Paris

permissions: {}

concurrency:
  group: nix-cache-main
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Nix
        if: github.event_name == 'schedule'
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0

      - name: Update flake inputs
        if: github.event_name == 'schedule'
        run: nix flake update

      - name: Verify update scope
        if: github.event_name == 'schedule'
        run: |
          if ! git diff --quiet -- . ':(exclude)flake.lock'; then
            echo "Refusing to continue with changes outside flake.lock" >&2
            git diff --stat >&2
            exit 1
          fi

      - name: Upload effective lock file
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flake-lock
          path: flake.lock
          if-no-files-found: error
          retention-days: 1

  shared-checks:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Download effective lock file
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: flake-lock
          path: .

      - name: Reclaim runner disk space
        run: |
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache
          df -h /

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          extra_nix_config: |
            extra-substituters = https://attic.xuyh0120.win/lantian
            extra-trusted-public-keys = lantian:EeAUQ+W+6r7EtwnmYjeVwx5kOGEBpjlBfPlzGlTNvHc=

      - name: Configure Cachix
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: clementpoiret
          extraPullNames: nix-community,nixpkgs-python,nix-gaming,cuda-maintainers,devenv,pi
          skipPush: true

      - name: Realize flake evaluation dependencies
        run: |
          # Stylix and fw-fanctrl read generated files while evaluating the flake.
          nix build \
            --no-link \
            --no-update-lock-file \
            .#nixosConfigurations.desktop.pkgs.base16-schemes \
            .#nixosConfigurations.laptop.pkgs.fw-fanctrl

      - name: Evaluate all flake checks
        run: nix flake check --no-build --no-update-lock-file

      - name: Build shared flake checks
        run: |
          nix build \
            --no-link \
            --no-update-lock-file \
            --print-build-logs \
            --keep-going \
            .#checks.x86_64-linux.host-cpu-optimizations \
            .#checks.x86_64-linux.apparmor-mode-matrix \
            .#checks.x86_64-linux.apparmor-policy-parser \
            .#checks.x86_64-linux.apparmor-vm

  build-host:
    name: Build and cache ${{ matrix.host }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        host:
          - desktop
          - laptop
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Download effective lock file
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: flake-lock
          path: .

      - name: Reclaim runner disk space
        run: |
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache
          df -h /

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          extra_nix_config: |
            extra-substituters = https://attic.xuyh0120.win/lantian
            extra-trusted-public-keys = lantian:EeAUQ+W+6r7EtwnmYjeVwx5kOGEBpjlBfPlzGlTNvHc=

      - name: Require Cachix credentials
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: test -n "$CACHIX_AUTH_TOKEN"

      - name: Configure Cachix
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: clementpoiret
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community,nixpkgs-python,nix-gaming,cuda-maintainers,devenv,pi
          skipPush: true

      - name: Build and cache selected host outputs
        shell: bash
        run: |
          set -euo pipefail

          cachix watch-exec clementpoiret -- \
            nix build \
              --no-link \
              --no-update-lock-file \
              --print-build-logs \
              ".#cache-root-${{ matrix.host }}"

          root="$(
            nix build \
              --no-link \
              --print-out-paths \
              --no-update-lock-file \
              ".#cache-root-${{ matrix.host }}"
          )"

          cachix pin clementpoiret "host-optimized-${{ matrix.host }}" "$root" --keep-revisions 1

      - name: Build host configuration
        run: |
          nix build \
            --no-link \
            --no-update-lock-file \
            --print-build-logs \
            ".#checks.x86_64-linux.${{ matrix.host }}-toplevel"

  commit-update:
    if: github.event_name == 'schedule'
    needs:
      - shared-checks
      - build-host
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Download verified lock file
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: flake-lock
          path: .

      - name: Commit updated lock file
        run: |
          if git diff --quiet -- flake.lock; then
            echo "flake.lock is already current"
            exit 0
          fi

          if ! git diff --quiet -- . ':(exclude)flake.lock'; then
            echo "Refusing to commit changes outside flake.lock" >&2
            git diff --stat >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          git commit -m "chore(deps): update flake inputs"
          git push origin HEAD:main
